    html.gb-booting { overflow: hidden; }

    @keyframes gbBootDot { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) {
