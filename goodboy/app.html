<body class="is-miniapp mode-app gb-site">

  <script src="js/demo-api.js?v=026"></script>
  <script src="js/api.js?v=026"></script>

  <script src="js/site.js?v=026"></script>
  <script>
    GB_CONFIG.version = "0.2.6";
    document.addEventListener("DOMContentLoaded", function () {
      try {
        if (window.Telegram && Telegram.WebApp) {
          Telegram.WebApp.ready();
          Telegram.WebApp.expand();
        }
      } catch (e) {}
      GBSite.boot({ forceMiniapp: true });
    });
  </script>
