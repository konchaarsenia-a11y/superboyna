<!-- Фрагмент кабинета: сайт и TG Mini App монтируют одно и то же -->
<div class="app gb-cabinet" id="gbAppShell">
  <div id="demoBanner" class="demo-banner" style="display:none;">
    Черновик кабинета · демо-данные на этом устройстве
  </div>

  <section id="gate" class="gate" style="display:none;">
    <h1>Войдите через Telegram</h1>
    <p class="lead">В Mini App аккаунт подтянется сам. На сайте можно начать в демо.</p>
    <button type="button" class="btn" id="enterDemo">Открыть демо</button>
  </section>

  <div id="cabinet" class="cabinet-app">
    <header class="cabinet-header">
      <div class="cabinet-header-brand">
        <img src="assets/logo-mark-v3.png?v=087" width="28" height="28" alt="" />
        <div>
          <span class="cabinet-header-kicker">GOOD&nbsp;BOY</span>
          <h1 class="cabinet-title" id="cabinetTitle">Профиль</h1>
        </div>
      </div>
      <div class="cabinet-header-user" id="topMeta" title="Аккаунт">Гость</div>
    </header>

    <main class="cabinet-pages" id="cabinetPages">
      <section class="cabinet-page is-active" data-page="profile" id="pageProfile" aria-label="Профиль"></section>
      <section class="cabinet-page" data-page="map" id="pageMap" aria-label="Карта"></section>
      <section class="cabinet-page" data-page="subscription" id="pageSubscription" aria-label="Подписка"></section>
      <section class="cabinet-page" data-page="partners" id="pagePartners" aria-label="Партнёры"></section>
    </main>

    <nav class="cabinet-nav" role="tablist" aria-label="Разделы кабинета">
      <button type="button" class="is-active" data-page="profile" role="tab" aria-selected="true">
        <span class="cabinet-nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span class="cabinet-nav-label">Профиль</span>
      </button>
      <button type="button" data-page="map" role="tab" aria-selected="false">
        <span class="cabinet-nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-4.6 7-11a7 7 0 10-14 0c0 6.4 7 11 7 11z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/></svg>
        </span>
        <span class="cabinet-nav-label">Карта</span>
      </button>
      <button type="button" data-page="subscription" role="tab" aria-selected="false">
        <span class="cabinet-nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16v11a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="currentColor" stroke-width="1.8"/><path d="M8 8V6a4 4 0 018 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span class="cabinet-nav-label">Подписка</span>
      </button>
      <button type="button" data-page="partners" role="tab" aria-selected="false">
        <span class="cabinet-nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 15.8 7.2 18l.9-5.4-3.9-3.8 5.4-.8L12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </span>
        <span class="cabinet-nav-label">Партнёры</span>
      </button>
    </nav>
  </div>
</div>

<div class="toast" id="gbToast" role="status"></div>
