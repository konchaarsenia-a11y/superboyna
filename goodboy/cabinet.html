<!-- Фрагмент кабинета: сайт и TG Mini App монтируют одно и то же -->
<div class="app gb-cabinet" id="gbAppShell">
  <div id="demoBanner" class="demo-banner" style="display:none;">
    Черновик кабинета · демо-данные на этом устройстве
  </div>

  <section id="gate" class="gate" style="display:none;">
    <h1>Войдите через Telegram</h1>
    <p class="lead">В Mini App аккаунт подтянется сам. На сайте можно начать в демо.</p>
    <button type="button" class="btn" id="enterDemo">Открыть демо</button>
  </section>

  <div id="cabinet" class="cabinet-shell">
    <div class="cabinet-screen phone-screen" id="cabinetScreen" tabindex="0" aria-label="Кабинет GOOD BOY">
      <div class="phone-status">
        <span>9:41</span>
        <span class="phone-status-dots" aria-hidden="true"></span>
      </div>
      <div class="phone-brand">
        <img src="assets/logo-mark-v3.png?v=087" width="22" height="22" alt="" />
        <span>GOOD&nbsp;BOY</span>
      </div>

      <div class="phone-slides cabinet-slides">
        <article class="phone-slide is-on" data-slide="0" id="slidePet" aria-label="Питомец"></article>
        <article class="phone-slide" data-slide="1" id="slideDelivery" aria-label="Доставка"></article>
        <article class="phone-slide" data-slide="2" id="slideCity" aria-label="Город"></article>
        <article class="phone-slide" data-slide="3" id="slidePartners" aria-label="Партнёры"></article>
      </div>

      <div class="phone-tabs cabinet-tabs" role="tablist" aria-label="Экраны кабинета">
        <button type="button" class="is-on" data-tab="0" aria-label="Питомец"></button>
        <button type="button" data-tab="1" aria-label="Доставка"></button>
        <button type="button" data-tab="2" aria-label="Город"></button>
        <button type="button" data-tab="3" aria-label="Партнёры"></button>
      </div>
    </div>
  </div>

  <div class="cabinet-overlay" id="petOverlay" hidden>
    <div class="cabinet-overlay-card">
      <button type="button" class="cabinet-overlay-close" id="petOverlayClose" aria-label="Закрыть">×</button>
      <h2>Питомец</h2>
      <p class="lead">Карточка — центр Goodboy.</p>
      <form id="petForm">
        <div class="field"><label>Кличка</label><input name="name" required placeholder="Бим" autocomplete="off" /></div>
        <div class="field"><label>Порода</label><input name="breed" placeholder="Корги" /></div>
        <div class="field"><label>Вес, кг</label><input name="weightKg" type="number" min="0" step="0.1" inputmode="decimal" /></div>
        <div class="field"><label>Возраст, лет</label><input name="ageYears" type="number" min="0" step="0.5" inputmode="decimal" /></div>
        <div class="field"><label>Аллергии / не ест</label><textarea name="allergies" rows="2" placeholder="Курица…"></textarea></div>
        <div class="field"><label>Заметки</label><textarea name="notes" rows="2"></textarea></div>
        <button type="submit" class="btn">Сохранить</button>
      </form>
    </div>
  </div>

  <div class="cabinet-overlay" id="linkOverlay" hidden>
    <div class="cabinet-overlay-card">
      <button type="button" class="cabinet-overlay-close" id="linkOverlayClose" aria-label="Закрыть">×</button>
      <h2>Подписка</h2>
      <p class="lead">Привязка к доставке Бойни — демо по телефону или нику.</p>
      <div id="subDetail"></div>
      <form id="linkForm" style="margin-top:16px;">
        <div class="field"><label>Телефон</label><input id="linkPhone" name="phone" placeholder="+375…" inputmode="tel" /></div>
        <div class="field"><label>Ник / Instagram</label><input id="linkNick" name="nick" placeholder="@nick" autocomplete="off" /></div>
        <button type="submit" class="btn">Найти и привязать</button>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="gbToast" role="status"></div>
