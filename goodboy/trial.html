<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Бесплатный период — GOOD BOY</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://goodboy.by/week.html" />
  <meta http-equiv="refresh" content="0; url=week.html" />
  <script>
    (function () {
      var dest = "week.html" + location.search + location.hash;
      var metas = document.getElementsByTagName("meta");
      for (var i = 0; i < metas.length; i++) {
        if ((metas[i].httpEquiv || "").toLowerCase() === "refresh") {
          metas[i].setAttribute("content", "0; url=" + dest);
        }
      }
      var link = document.getElementById("trial-moved");
      if (link) link.setAttribute("href", dest);
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Страница переехала: <a id="trial-moved" href="week.html">week.html</a></p>
</body>
</html>
