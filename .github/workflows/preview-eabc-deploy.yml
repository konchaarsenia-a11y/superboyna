# Preview-only Worker deploy (boinya-c-preview-eabc). Never touches prod boinya-c.
name: preview-eabc-deploy

on:
  workflow_dispatch:
  push:
    branches: [cursor/clients-sheet-fix-eabc]
    paths:
      - boinya-c/proxy/worker.js
      - boinya-c/proxy/*.js
      - .github/workflows/preview-eabc-deploy.yml

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy boinya-c-preview-eabc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "NO_CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          cd boinya-c/proxy
          cat > wrangler.preview-eabc.toml <<'TOML'
          name = "boinya-c-preview-eabc"
          main = "worker.js"
          compatibility_date = "2024-11-01"
          keep_vars = true

          [vars]
          PEOPLE_CANON = "d1-primary"
          OPS_CANON = "d1-primary"
          DEFERRED_CANON = "d1-primary"
          SUBS_CANON = "d1-primary"
          WAREHOUSE_CANON = "d1-primary"
          META_CANON = "d1-primary"
          CUTTING_STRUCT_CANON = "d1-primary"
          PRICE_CANON = "d1-primary"
          PARTNER_CANON = "d1-primary"
          GB_CANON = "d1-primary"
          WEEK_D1_SYNC = "gas-authoritative"
          WEEK_CLOSE_CANON = "d1-sync"
          OWNER_TELEGRAM_IDS = "650923866"
          PARTNER_OWNER_TIDS = "827494606,650923866"
          PARTNER_OWNER_USERNAMES = "one_more_person_228"
          PREVIEW_ISOLATED = "1"
          PREVIEW_MARKER = "clients-fix2-preview-h1"
          SHEETS_FINISH_ONLY = "1"
          SHEETS_MODE = "finish-only"
          AUTH_ENFORCE = "1"
          TELEGRAM_BOT_USERNAME = "BoinyaTest_bot"
          GAS_ORIGIN = "https://boinya-c-preview-eabc.konchaarsenia.workers.dev/__gas_stub_unused"

          [[d1_databases]]
          binding = "DB"
          database_name = "boinya-c-preview-eabc"
          database_id = "0ddccc42-3444-4adb-9c15-68925880b146"

          [triggers]
          crons = ["* * * * *"]
          TOML
          npx wrangler@4 deploy -c wrangler.preview-eabc.toml
          curl -fsSL --max-time 30 "https://boinya-c-preview-eabc.konchaarsenia.workers.dev/?action=ping&cutover=1" | tee /tmp/preview-ping.json
          node -e 'const j=require("/tmp/preview-ping.json"); if(j.deployMarker!=="clients-fix2-preview-h1"||j.previewIsolated!==true){console.error(j); process.exit(1)}'
