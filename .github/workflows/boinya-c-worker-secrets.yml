# deploy-secret-race-h1: ручной/редкий put секретов Worker — НЕ на каждый deploy.
# Та же concurrency-группа, что и deploy/bot-hook. Только при изменении (FORCE=1 или fingerprint).
name: boinya-c-worker-secrets

on:
  workflow_dispatch:
    inputs:
      force:
        description: "1 = put all listed secrets even if fingerprint matches"
        required: false
        default: "0"
      which:
        description: "comma list: TELEGRAM_BOT_TOKEN,CLIENT_BOT_TOKEN,PARTNER_BOT_TOKEN,PP_COST_BREAKDOWN_PIN or ALL"
        required: false
        default: "ALL"

permissions:
  contents: read

concurrency:
  group: boinya-c-worker-mutate
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Put Worker secrets sequentially (only if needed)
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLIENT_BOT_TOKEN: ${{ secrets.CLIENT_BOT_TOKEN }}
          PARTNER_BOT_TOKEN: ${{ secrets.PARTNER_BOT_TOKEN }}
          PP_COST_BREAKDOWN_PIN: ${{ secrets.PP_COST_BREAKDOWN_PIN }}
          FORCE: ${{ github.event.inputs.force }}
          WHICH: ${{ github.event.inputs.which }}
        run: |
          set -euo pipefail
          # deploy-secret-race-h1: sequential secret put; skip unchanged fingerprint
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          which=$(echo "${WHICH:-ALL}" | tr '[:lower:]' '[:upper:]')
          force="${FORCE:-0}"
          mkdir -p /tmp/secfp
          put_one() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then
              echo "skip $name (empty)"
              return 0
            fi
            local fp
            fp=$(printf '%s' "$val" | sha256sum | awk '{print $1}')
            local store="/tmp/secfp/${name}.sha"
            # remote fingerprint file in snap is overkill; local per-run always puts unless we check ping
            # Use Worker ping: if TELEGRAM and hasTelegramToken and force!=1 → skip TELEGRAM_BOT_TOKEN
            if [ "$force" != "1" ] && [ "$name" = "TELEGRAM_BOT_TOKEN" ]; then
              if curl -fsSL --max-time 20 "https://boinya-c.konchaarsenia.workers.dev/?action=ping&cutover=1" | python3 -c "import sys,json;d=json.load(sys.stdin);raise SystemExit(0 if d.get('hasTelegramToken') else 1)"; then
                echo "skip TELEGRAM_BOT_TOKEN (hasTelegramToken already true, force!=1)"
                return 0
              fi
            fi
            echo "::add-mask::$val"
            echo "putting $name …"
            for i in 1 2 3 4 5; do
              if printf '%s' "$val" | npx wrangler@4 secret put "$name"; then
                echo "ok $name"
                return 0
              fi
              echo "retry $name ($i) after concurrent modify / version lag"
              sleep $((i * 4))
            done
            echo "::warning::$name put failed after retries — Worker deploy remains live"
            return 0
          }
          want() {
            local n="$1"
            [ "$which" = "ALL" ] && return 0
            echo ",$which," | grep -q ",$n," && return 0
            return 1
          }
          want TELEGRAM_BOT_TOKEN && put_one TELEGRAM_BOT_TOKEN "${TELEGRAM_BOT_TOKEN:-}"
          want CLIENT_BOT_TOKEN && put_one CLIENT_BOT_TOKEN "${CLIENT_BOT_TOKEN:-}"
          want PARTNER_BOT_TOKEN && put_one PARTNER_BOT_TOKEN "${PARTNER_BOT_TOKEN:-}"
          want PP_COST_BREAKDOWN_PIN && put_one PP_COST_BREAKDOWN_PIN "${PP_COST_BREAKDOWN_PIN:-}"
          curl -fsSL --max-time 30 "https://boinya-c.konchaarsenia.workers.dev/?action=ping&cutover=1" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d.get('live') and d.get('d1'); print('ping', d.get('deployMarker'), 'tg', d.get('hasTelegramToken'))"
