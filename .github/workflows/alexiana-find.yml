name: alexiana-find

on:
  pull_request:
    paths:
      - .github/workflows/alexiana-find.yml
      - scripts/alexiana-find.mjs
      - boinya-c/proxy/alexiana-find.js
      - boinya-c/proxy/alexiana-find.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Match rules
        run: node --test boinya-c/proxy/alexiana-find.test.mjs
      - name: Read matching rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALEXIANA_OUT: ${{ github.workspace }}/artifacts/alexiana-find
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          node scripts/alexiana-find.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alexiana-find
          path: artifacts/alexiana-find/
          if-no-files-found: warn
