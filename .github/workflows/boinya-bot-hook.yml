# Разово и при смене скрипта: секрет вебхука на воркер и setWebhook @boyniaGB_bot.
# Сообщений не шлёт. Партнёрский бот не трогает.
name: boinya-bot-hook

on:
  pull_request:
    paths:
      - .github/workflows/boinya-bot-hook.yml
      - scripts/boinya-bot-hook.mjs
      - boinya-c/proxy/bot-hook.js
      - boinya-c/proxy/bot-hook.test.mjs
      - boinya-c/proxy/worker.js
  push:
    branches: [main]
    paths:
      - .github/workflows/boinya-bot-hook.yml
      - scripts/boinya-bot-hook.mjs
      - boinya-c/proxy/bot-hook.js
      - boinya-c/proxy/worker.js
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# deploy-conc-split-h1: своя очередь хука — НЕ boinya-c-worker-deploy (deadlock wait↔deploy)
concurrency:
  group: boinya-bot-hook
  cancel-in-progress: false

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hook decisions and worker syntax
        run: |
          node --check boinya-c/proxy/worker.js
          node --test boinya-c/proxy/bot-hook.test.mjs

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait until no active worker-deploy (hook-secret-stable-h1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "User-Agent": "hook-secret-stable-h1"}
          active = {"queued", "in_progress", "waiting", "pending", "requested"}
          deadline = time.time() + 20 * 60
          # hook-secret-stable-h1: ждать пока нет активных deploy (любой sha)
          while time.time() < deadline:
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/actions/workflows/boinya-c-worker-deploy.yml/runs?per_page=20" % repo,
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  runs = json.load(resp).get("workflow_runs") or []
              busy = [r for r in runs if r.get("status") in active]
              if busy:
                  print("worker-deploy active:", [str(r.get("head_sha") or "")[:8] for r in busy], flush=True)
                  time.sleep(15)
                  continue
              same = [r for r in runs if r.get("head_sha") == sha]
              if same:
                  last = sorted(same, key=lambda r: r.get("created_at") or "")[-1]
                  print("worker-deploy this sha:", last.get("conclusion"), flush=True)
                  if last.get("conclusion") not in (None, "success", "skipped", "cancelled") and last.get("status") not in active:
                      if last.get("conclusion") != "success":
                          raise SystemExit("worker-deploy на этом sha не зелёный: " + str(last.get("conclusion")))
              else:
                  print("worker-deploy: на этом sha нет (только hook) — ок", flush=True)
              break
          else:
              raise SystemExit("worker-deploy очередь не освободилась")
          PY
      - name: Secret, webhook, probe /start
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          BOT_HOOK_OUT: ${{ github.workspace }}/artifacts/boinya-bot-hook
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          node scripts/boinya-bot-hook.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boinya-bot-hook
          path: artifacts/boinya-bot-hook/
          if-no-files-found: warn
