name: gb-test-client

# Копия снимков кабинета и запись только тестового клиента. Чужие строки не меняет.

on:
  pull_request:
    paths:
      - .github/workflows/gb-test-client.yml
      - scripts/gb-test-client.mjs
      - boinya-c/proxy/cabinet-link.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backup cabinet snaps and upsert test client
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          node ../../scripts/gb-test-client.mjs
