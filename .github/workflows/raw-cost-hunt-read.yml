# Только чтение D1 + listRawCosts. Ничего не пишет.
name: raw-cost-hunt-read

on:
  pull_request:
    paths:
      - .github/workflows/raw-cost-hunt-read.yml
      - scripts/raw-cost-hunt-read.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Raw cost hunt (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_COST_HUNT_OUT: ${{ github.workspace }}/artifacts/raw-cost-hunt
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          node scripts/raw-cost-hunt-read.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-cost-hunt
          path: artifacts/raw-cost-hunt/
          if-no-files-found: warn
