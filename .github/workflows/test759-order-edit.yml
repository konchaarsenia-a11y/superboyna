# Live TEST759: create/edit/delete order on prod Worker+D1 (owner initData).
# Manual only — not on every push.
name: test759-order-edit

on:
  workflow_dispatch:
  # also on push — gh dispatch 403 for this integration; Arseny «ДА» on TEST759 live
  push:
    branches: [main]
    paths:
      - "scripts/test759-order-edit-row.mjs"
      - ".github/workflows/test759-order-edit.yml"

permissions:
  contents: read

concurrency:
  group: test759-order-edit
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install playwright chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: TEST759 order-edit-row-actions live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST759_OUT: ${{ github.workspace }}/artifacts/test759
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          mkdir -p "$TEST759_OUT"
          node scripts/test759-order-edit-row.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test759-report
          path: artifacts/test759/
