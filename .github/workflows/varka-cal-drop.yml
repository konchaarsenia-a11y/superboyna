name: varka-cal-drop
# Снять только CAL:ВАРКА:2026-10-27. Копия в snap dupBackup:CAL:ВАРКА:2026-10-27.
# Склад и остальные заказы не трогать.

on:
  pull_request:
    paths:
      - ".github/workflows/varka-cal-drop.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/varka-cal-drop.yml"

permissions:
  contents: read

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Copy then soft-delete generic Varka row
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts/varka-cal-drop"
          python3 - <<'PY'
          import json, os, subprocess
          root = os.environ["GITHUB_WORKSPACE"] + "/artifacts/varka-cal-drop"
          RID = "CAL:ВАРКА:2026-10-27"
          KEY = "dupBackup:CAL:ВАРКА:2026-10-27"
          NOW = "2026-10-23T10:40:00.000Z"

          def run(sql, name, file_sql=False):
              path = root + "/" + name + ".json"
              cmd = ["npx", "wrangler@4", "d1", "execute", "boinya-c", "--remote", "--json"]
              if file_sql:
                  open(root + "/" + name + ".sql", "w", encoding="utf-8").write(sql)
                  cmd += ["--file", root + "/" + name + ".sql"]
              else:
                  cmd += ["--command", sql]
              subprocess.check_call(cmd, stdout=open(path, "w", encoding="utf-8"))
              return path

          def blocks(path):
              data = json.loads(open(path, encoding="utf-8").read())
              return data if isinstance(data, list) else [data]

          def rows(path):
              out = []
              for block in blocks(path):
                  if isinstance(block, dict) and isinstance(block.get("results"), list):
                      out.extend(block["results"])
              return out

          def changes(path):
              n = 0
              for block in blocks(path):
                  meta = block.get("meta") if isinstance(block, dict) else None
                  if isinstance(meta, dict):
                      n += int(meta.get("changes") or 0)
              return n

          def q(s):
              return str(s).replace("'", "''")

          run(
              "SELECT * FROM orders WHERE id = 'CAL:ВАРКА:2026-10-27' OR (status = 'active' AND date_iso = '2026-10-27')",
              "before"
          )
          before = rows(root + "/before.json")
          others = [r for r in before if r.get("id") != RID and r.get("status") == "active" and r.get("date_iso") == "2026-10-27"]
          target = [r for r in before if r.get("id") == RID and r.get("status") == "active"]
          deleted = [r for r in before if r.get("id") == RID and r.get("status") == "deleted"]
          if others:
              raise SystemExit("refuse: other active rows on 2026-10-27: %s" % [r.get("id") for r in others])
          if len(target) > 1:
              raise SystemExit("refuse: active copies %s" % len(target))
          row = target[0] if target else (deleted[0] if deleted else None)
          if not row:
              raise SystemExit("refuse: row missing")
          if str(row.get("client") or "") != "Варка" or str(row.get("date_iso") or "") != "2026-10-27":
              raise SystemExit("refuse: client/date %s %s" % (row.get("client"), row.get("date_iso")))
          addr = str(row.get("address") or "")
          meta = {}
          try:
              meta = json.loads(row.get("meta_json") or "{}")
          except Exception:
              meta = {}
          price = meta.get("orderPrice")
          if "цвирко" not in addr.lower() and str(price) not in ("21", "21.0", "21.00"):
              raise SystemExit("refuse: not tsvirko address=%s price=%s" % (addr, price))
          backup = {
              "reason": "dup of Varka Цвирко 100 on 2026-10-27",
              "at": NOW,
              "row": row
          }
          raw = json.dumps(backup, ensure_ascii=False)
          run(
              "INSERT INTO snap_cache (cache_key, payload, updated_at) VALUES ('%s', '%s', '%s') "
              "ON CONFLICT(cache_key) DO UPDATE SET payload = excluded.payload, updated_at = excluded.updated_at"
              % (KEY, q(raw), NOW),
              "backup",
              True
          )
          if not target:
              run("SELECT cache_key, updated_at FROM snap_cache WHERE cache_key = '%s'" % KEY, "backup-exists")
              if not rows(root + "/backup-exists.json"):
                  raise SystemExit("refuse: already deleted and backup missing")
              json.dump({"alreadyDeleted": True, "backup": KEY, "others": 0}, open(root + "/result.json", "w"), ensure_ascii=False, indent=2)
              print(json.dumps({"alreadyDeleted": True, "backup": KEY}))
              raise SystemExit(0)
          run(
              "UPDATE orders SET status = 'deleted', updated_at = '%s' "
              "WHERE id = 'CAL:ВАРКА:2026-10-27' AND status = 'active' AND client = 'Варка' AND date_iso = '2026-10-27'"
              % NOW,
              "update"
          )
          if changes(root + "/update.json") != 1:
              raise SystemExit("refuse: changes != 1")
          tomb = json.dumps({"mk": "ВАРКА", "at": 1761210000000, "dateIso": "2026-10-27", "scope": "CAL", "reason": "dup-tsvirko"}, ensure_ascii=False)
          run(
              "INSERT INTO snap_cache (cache_key, payload, updated_at) VALUES ('delTomb:CAL:2026-10-27:ВАРКА', '%s', '%s') "
              "ON CONFLICT(cache_key) DO UPDATE SET payload = excluded.payload, updated_at = excluded.updated_at"
              % (q(tomb), NOW),
              "tomb",
              True
          )
          run("DELETE FROM snap_cache WHERE cache_key = 'viewDate:2026-10-27'", "viewdate")
          run(
              "SELECT id, client, status, date_iso FROM orders WHERE id = 'CAL:ВАРКА:2026-10-27' OR (status = 'active' AND date_iso = '2026-10-27')",
              "after"
          )
          after = rows(root + "/after.json")
          still = [r for r in after if r.get("id") == RID and r.get("status") == "active"]
          left = [r for r in after if r.get("status") == "active" and r.get("date_iso") == "2026-10-27"]
          if still or left:
              raise SystemExit("refuse: still active %s" % [r.get("id") for r in still + left])
          run("SELECT cache_key FROM snap_cache WHERE cache_key = '%s'" % KEY, "backup-check")
          if not rows(root + "/backup-check.json"):
              raise SystemExit("refuse: backup snap missing")
          po = rows(run("SELECT payload FROM snap_cache WHERE cache_key = 'partnerOrders'", "po"))
          points = []
          if po:
              try:
                  pack = json.loads(po[0].get("payload") or "{}")
              except Exception:
                  pack = {}
              for o in pack.get("orders") or []:
                  if str((o or {}).get("deliverDateIso") or "")[:10] != "2026-10-27":
                      continue
                  st = str((o or {}).get("status") or "").lower()
                  if st in ("delivered", "cancelled", "canceled"):
                      continue
                  points.append({"id": o.get("id"), "location": o.get("locationName"), "total": o.get("totalByn")})
          result = {"deleted": RID, "backup": KEY, "address": addr, "price": price, "points": points, "activeLeft": 0}
          json.dump(result, open(root + "/result.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False))
          PY
