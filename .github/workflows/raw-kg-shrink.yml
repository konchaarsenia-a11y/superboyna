# Live smoke: кг+усушка → себес100. Карточки не пишет.
name: raw-kg-shrink

on:
  pull_request:
    paths:
      - .github/workflows/raw-kg-shrink.yml
      - scripts/raw-kg-shrink-live.mjs
      - boinya-c/proxy/price-canon-v2.js
      - boinya-c/proxy/worker.js
      - boinya-c/next/retail-admin.js
  push:
    branches: [main]
    paths:
      - .github/workflows/raw-kg-shrink.yml
      - scripts/raw-kg-shrink-live.mjs
      - boinya-c/proxy/price-canon-v2.js
      - boinya-c/proxy/worker.js
      - boinya-c/next/retail-admin.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: formula unit
        run: node --test boinya-c/proxy/price-canon-v2.test.mjs

  live:
    # raw-kg-shrink: live на PR (мягко), push/main и dispatch (жёстко).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: wait worker-deploy on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            last=$(gh run list --workflow=boinya-c-worker-deploy.yml --branch main --limit 1 --json conclusion,status,headSha -q '.[0]')
            echo "$i $last"
            sha=$(echo "$last" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("headSha") or "")')
            conc=$(echo "$last" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')
            st=$(echo "$last" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")')
            if [ "$sha" = "${{ github.sha }}" ] && [ "$conc" = "success" ]; then exit 0; fi
            if [ "$sha" = "${{ github.sha }}" ] && [ "$conc" = "failure" ]; then exit 1; fi
            sleep 15
          done
          echo "worker-deploy timeout"; exit 1
      - name: live saveRawCost kg+shrink (future date)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_KG_OUT: ${{ github.workspace }}/artifacts/raw-kg-shrink
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/raw-kg-shrink-live.mjs || {
              echo "::warning::live save failed (worker ещё без патча?) — unit ок"
              exit 0
            }
          else
            node scripts/raw-kg-shrink-live.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-kg-shrink
          path: artifacts/raw-kg-shrink/
          if-no-files-found: warn
