name: pp-n2-basket2-split

on:
  pull_request:
    paths:
      - .github/workflows/pp-n2-basket2-split.yml
      - boinya-c/proxy/pp-per-delivery.js
      - boinya-c/proxy/pp-per-delivery.test.mjs
      - boinya-c/proxy/worker.js
  push:
    branches: [main]
    paths:
      - .github/workflows/pp-n2-basket2-split.yml
      - boinya-c/proxy/pp-per-delivery.js
      - boinya-c/proxy/worker.js
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check boinya-c/proxy/worker.js
          node --test boinya-c/proxy/pp-per-delivery.test.mjs

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: self-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait until worker deploy on this sha finishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          deadline = time.time() + 20 * 60
          active = {"queued", "in_progress", "waiting", "pending", "requested"}
          while time.time() < deadline:
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/actions/runs?head_sha=%s&per_page=100" % (repo, sha),
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "User-Agent": "pp-n2-split"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  runs = json.load(resp).get("workflow_runs") or []
              mine = [r for r in runs if r.get("name") == "boinya-c-worker-deploy"]
              if not mine:
                  print("worker-deploy: ещё нет", flush=True)
                  time.sleep(15)
                  continue
              if any(r.get("status") in active for r in mine):
                  print("worker-deploy: ещё идёт", flush=True)
                  time.sleep(15)
                  continue
              last = sorted(mine, key=lambda r: r.get("created_at") or "")[-1]
              print("worker-deploy: " + str(last.get("conclusion")), flush=True)
              if last.get("conclusion") != "success":
                  raise SystemExit("worker-deploy не зелёный")
              break
          else:
              raise SystemExit("worker-deploy не дождались")
          PY
      - name: Dry-run then apply staff split
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts/pp-n2-basket2-split"
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          put_ok=0
          for i in 1 2 3 4 5 6; do
            if printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put PP_N2_SPLIT_ADMIN_TOKEN; then
              put_ok=1
              break
            fi
            echo "secret put не прошёл, попытка $i"
            sleep 20
          done
          test "$put_ok" = 1
          # wrangler secret put не редеплоит сам — дождаться следующего запроса; secret уже в env после put на workers
          post() {
            local mode="$1"
            local out="$2"
            local confirm="$3"
            local code
            code=$(curl -sS -o "$out" -w "%{http_code}" \
              -X POST "https://boinya-c.konchaarsenia.workers.dev/admin/pp-n2-split" \
              -H "Content-Type: application/json" \
              -H "X-Pp-N2-Split-Token: $TOKEN" \
              --data "{\"mode\":\"$mode\",\"confirm\":\"$confirm\"}" \
              --max-time 180 || true)
            echo "$mode HTTP $code" >&2
            printf '%s' "$code"
          }
          dry_code=$(post dry-run "$GITHUB_WORKSPACE/artifacts/pp-n2-basket2-split/dry.json" "")
          python3 - "$GITHUB_WORKSPACE/artifacts/pp-n2-basket2-split/dry.json" "$dry_code" <<'PY'
          import json, sys
          path, code = sys.argv[1], sys.argv[2]
          data = json.load(open(path, encoding="utf-8"))
          print(json.dumps({"status": data.get("status"), "mode": data.get("mode"), "plan": {
            "migrateN": (data.get("plan") or {}).get("migrateN"),
            "alreadyN": (data.get("plan") or {}).get("alreadyN"),
            "ambiguousN": (data.get("plan") or {}).get("ambiguousN"),
            "migrate": (data.get("plan") or {}).get("migrate"),
            "ambiguous": (data.get("plan") or {}).get("ambiguous"),
          }, "tip": data.get("tip")}, ensure_ascii=False))
          if code != "200" or data.get("status") != "success":
              raise SystemExit("dry-run не сошёлся")
          amb = (data.get("plan") or {}).get("ambiguousN") or 0
          if amb:
              raise SystemExit("ambiguous_cards — apply стоп")
          PY
          apply_code=$(post apply "$GITHUB_WORKSPACE/artifacts/pp-n2-basket2-split/apply.json" "split-pp-n2-basket-2026-11-07")
          python3 - "$GITHUB_WORKSPACE/artifacts/pp-n2-basket2-split/apply.json" "$apply_code" <<'PY'
          import json, sys
          path, code = sys.argv[1], sys.argv[2]
          data = json.load(open(path, encoding="utf-8"))
          print(json.dumps({
            "status": data.get("status"),
            "backup": data.get("backup"),
            "changedN": data.get("changedN"),
            "changed": data.get("changed"),
            "ordersSame": data.get("ordersSame"),
            "subsSame": data.get("subsSame"),
            "pricesOk": data.get("pricesOk"),
            "message": data.get("message"),
          }, ensure_ascii=False))
          if code != "200" or data.get("status") != "success" or data.get("ordersSame") is not True:
              raise SystemExit("apply не сошёлся")
          PY
      - name: Delete one-time PP_N2_SPLIT_ADMIN_TOKEN
        if: always()
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx --yes wrangler@4 secret delete PP_N2_SPLIT_ADMIN_TOKEN || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pp-n2-basket2-split
          path: artifacts/pp-n2-basket2-split/
          if-no-files-found: warn
