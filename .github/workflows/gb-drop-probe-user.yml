name: gb-drop-probe-user

# Удаляет одну служебную строку кабинета. Чужие снимки не переписывает.

on:
  pull_request:
    paths:
      - .github/workflows/gb-drop-probe-user.yml
      - scripts/gb-drop-probe-user.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Drop the probe cabinet user
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          node ../../scripts/gb-drop-probe-user.mjs
