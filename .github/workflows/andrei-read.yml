name: andrei-read

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/andrei-oct5-card-f592
    paths:
      - "scripts/recover-andrei-read.mjs"
      - ".github/workflows/andrei-read.yml"

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read andreiprigunov
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/recover-andrei-read.mjs
