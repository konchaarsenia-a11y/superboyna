name: varka-asm-read

# Только чтение: заказы и сборка Варки на 2026-10-27. Ничего не пишет.

on:
  push:
    paths:
      - .github/workflows/varka-asm-read.yml
      - scripts/varka-asm-read.mjs

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read Varka assembly 27 Oct
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts/varka-asm"
          q() {
            local name="$1"
            local sql="$2"
            echo "---- $name"
            set +e
            npx wrangler@4 d1 execute boinya-c --remote --json --command "$sql" > "$GITHUB_WORKSPACE/artifacts/varka-asm/$name.json" 2> "$GITHUB_WORKSPACE/artifacts/varka-asm/$name.err"
            local code=$?
            set -e
            echo "exit=$code bytes=$(wc -c < "$GITHUB_WORKSPACE/artifacts/varka-asm/$name.json" | tr -d ' ')"
            if [ "$code" -ne 0 ]; then
              echo "STDERR:"
              cat "$GITHUB_WORKSPACE/artifacts/varka-asm/$name.err" || true
              exit "$code"
            fi
          }
          q orders "SELECT id, client, match_key, address, day_name, date_iso, status, segment, basket_json FROM orders WHERE date_iso = '2026-10-27' AND (upper(client) LIKE '%ВАРК%' OR upper(client) LIKE '%VARK%' OR upper(ifnull(match_key,'')) LIKE '%ВАРК%' OR upper(ifnull(match_key,'')) LIKE '%VARK%' OR upper(ifnull(address,'')) LIKE '%ЦВИРК%' OR upper(ifnull(address,'')) LIKE '%ШЕВЧЕН%')"
          q partners "SELECT payload FROM snap_cache WHERE cache_key = 'partnerOrders'"
          q assembly "SELECT payload FROM snap_cache WHERE cache_key = 'assembly:Вторник'"
          node "$GITHUB_WORKSPACE/scripts/varka-asm-read.mjs" "$GITHUB_WORKSPACE/artifacts/varka-asm"
      - uses: actions/upload-artifact@v4
        with:
          name: varka-asm
          path: artifacts/varka-asm/summary.json
