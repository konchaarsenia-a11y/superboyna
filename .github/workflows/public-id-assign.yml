name: public-id-assign
# Один раз проставить код клиента в listSubscriptions. Заказы и таблицу subs не менять.
# Повтор не выдаёт новый код. Копия publicIdBackup:2026-10-23.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-id-assign.yml"
      - "scripts/public-id-assign.mjs"

permissions:
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backup, assign public ids, compare orders and subs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          node scripts/public-id-assign.mjs
