name: bp-19-restore

# Вернуть sashin.pushok на 19.10 и пустые дни новой недели на доску.
# Указатель остаётся на 19.10. ПП2 и подписки не пишутся.
# Сначала снимок weekClosePreRestore. Только main.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bp-19-restore.yml
      - scripts/bp-19-restore.mjs

permissions:
  contents: read
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait until this SHA is the live worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/week-close-dupes-wait-deploy.py
      - name: Restore 19.10 and keep the pointer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          node scripts/bp-19-restore.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bp-19-restore
          path: artifacts/bp-19-restore
          if-no-files-found: warn
