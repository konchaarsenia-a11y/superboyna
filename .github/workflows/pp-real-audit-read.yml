# Только чтение D1 + calcPrice. Ничего не пишет в БД/Sheets.
name: pp-real-audit-read

on:
  pull_request:
    paths:
      - .github/workflows/pp-real-audit-read.yml
      - scripts/pp-real-audit-read.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit real PP cards (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PP_AUDIT_OUT: ${{ github.workspace }}/artifacts/pp-real-audit
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          node scripts/pp-real-audit-read.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pp-real-audit
          path: artifacts/pp-real-audit/
          if-no-files-found: warn
