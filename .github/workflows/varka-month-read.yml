name: varka-month-read

on:
  pull_request:
    paths:
      - "scripts/varka-month-read.mjs"
      - ".github/workflows/varka-month-read.yml"

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read partner orders and Varka calendar rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OUT: ${{ github.workspace }}/artifacts/varka-month
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          node scripts/varka-month-read.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varka-month-read
          path: artifacts/varka-month/
          if-no-files-found: warn
