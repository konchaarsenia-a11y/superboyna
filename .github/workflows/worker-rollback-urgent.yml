# Emergency Worker rollback to last known-good version (no D1 writes).
# Triggered by push to this branch. Promotes CF version from #747 deploy.
name: worker-rollback-urgent

on:
  push:
    branches: [cursor/worker-rollback-urgent-eabc]
    paths:
      - .github/workflows/worker-rollback-urgent.yml
  workflow_dispatch:
    inputs:
      version_id:
        description: Worker version ID @100%
        required: true
        default: 47670d0c-b89f-4308-95cb-4fbd6aceb5a1

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Promote last-good Worker version (#747)
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          VER="${{ github.event.inputs.version_id || '47670d0c-b89f-4308-95cb-4fbd6aceb5a1' }}"
          echo "Promoting $VER @100% (urgent rollback after #749)"
          npx wrangler@4 versions deploy "${VER}@100" -y --message "urgent rollback to #747 after #749"
          curl -fsSL --max-time 30 "https://boinya-c.konchaarsenia.workers.dev/?action=ping&cutover=1" | tee /tmp/ping.json
          python3 -c "import json;d=json.load(open('/tmp/ping.json')); assert d.get('live') is True and d.get('d1') is True; print('OK marker', d.get('deployMarker'), 'tg', d.get('hasTelegramToken'), 'auth', d.get('authMode'))"
