# Deploy Бойня C Worker — отдельный workflow (старый boinya-c-worker залип после fail)
name: boinya-c-worker-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "boinya-c/proxy/**"
      - ".github/workflows/boinya-c-worker-deploy.yml"

concurrency:
  group: boinya-c-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy boinya-c Worker
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out=$(npx wrangler@4 deploy 2>&1 | tee /dev/stderr)
          ver=$(echo "$out" | sed -n 's/.*Current Version ID: \([^ ]*\).*/\1/p' | tail -1)
          test -n "$ver"
          echo "Promoting version $ver to 100%"
          npx wrangler@4 versions deploy "${ver}@100" -y --message "CI promote 100%"
      - name: Smoke ping
        run: |
          curl -fsSL --max-time 30 "https://boinya-c.konchaarsenia.workers.dev/?action=ping&cutover=1" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('live') is True and d.get('d1') is True, d; assert 'ops-move-asm-flags' in str(d.get('deployMarker','')), d; print('ping OK', d)"
