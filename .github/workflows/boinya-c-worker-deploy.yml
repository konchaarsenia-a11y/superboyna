# Deploy Бойня C Worker — отдельный workflow (старый boinya-c-worker залип после fail)
# Secrets (repo Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN — required
#   CLOUDFLARE_ACCOUNT_ID — optional if token is account-scoped; empty is OK (unset before wrangler)
#   PARTNER_BOT_TOKEN — optional; put AFTER successful deploy; skip if empty; failure does not fail the job
#   PP_COST_BREAKDOWN_PIN — optional; put AFTER successful deploy; skip if empty; failure does not fail the job
name: boinya-c-worker-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "boinya-c/proxy/**"
      - ".github/workflows/boinya-c-worker-deploy.yml"

concurrency:
  group: boinya-c-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # wrangler 4.131+: `secret put` fails if latest version is not deployed.
      # Deploy + promote 100% first; then put secret. Secret must not block deploy.
      - name: Deploy boinya-c Worker
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID empty — unset so wrangler uses token-scoped account"
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          out=$(npx wrangler@4 deploy 2>&1 | tee /dev/stderr)
          ver=$(echo "$out" | sed -n 's/.*Current Version ID: \([^ ]*\).*/\1/p' | tail -1)
          test -n "$ver"
          echo "Promoting version $ver to 100%"
          npx wrangler@4 versions deploy "${ver}@100" -y --message "CI promote 100%"
      - name: Put PARTNER_BOT_TOKEN on Worker
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PARTNER_BOT_TOKEN: ${{ secrets.PARTNER_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID empty — unset so wrangler uses token-scoped account"
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          if [ -z "${PARTNER_BOT_TOKEN:-}" ]; then
            echo "PARTNER_BOT_TOKEN missing in GitHub secrets — skip"
            exit 0
          fi
          if ! printf '%s' "$PARTNER_BOT_TOKEN" | npx wrangler@4 secret put PARTNER_BOT_TOKEN; then
            echo "::warning::PARTNER_BOT_TOKEN put failed after deploy — worker is already live"
            exit 0
          fi
      - name: Put PP_COST_BREAKDOWN_PIN on Worker
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PP_COST_BREAKDOWN_PIN: ${{ secrets.PP_COST_BREAKDOWN_PIN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID empty — unset so wrangler uses token-scoped account"
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          if [ -z "${PP_COST_BREAKDOWN_PIN:-}" ]; then
            echo "PP_COST_BREAKDOWN_PIN missing in GitHub secrets — skip"
            exit 0
          fi
          if ! printf '%s' "$PP_COST_BREAKDOWN_PIN" | npx wrangler@4 secret put PP_COST_BREAKDOWN_PIN; then
            echo "::warning::PP_COST_BREAKDOWN_PIN put failed after deploy — worker is already live"
            exit 0
          fi
      - name: Smoke ping
        run: |
          curl -fsSL --max-time 30 "https://boinya-c.konchaarsenia.workers.dev/?action=ping&cutover=1" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('live') is True and d.get('d1') is True, d; print('ping OK', d.get('deployMarker'))"
