# Deploy Бойня C Worker.
# deploy-secret-race-h1: деплой НЕ делает secret put — секреты наследуют с прошлой
# версии. Put секретов только через boinya-c-worker-secrets / bot-hook, в той же
# concurrency-группе, последовательно. Падение secret put не блокирует live Worker.
#
# Secrets (repo Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN — required
#   CLOUDFLARE_ACCOUNT_ID — optional if token is account-scoped
name: boinya-c-worker-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "boinya-c/proxy/**"
      - ".github/workflows/boinya-c-worker-deploy.yml"

# Одна очередь на mutate Worker (deploy + secret put + bot-hook). Не отменять mid-flight.
concurrency:
  group: boinya-c-worker-mutate
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy boinya-c Worker + promote 100%
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # deploy-secret-race-h1: только upload+promote; secret put здесь запрещён
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID empty — unset so wrangler uses token-scoped account"
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          out=$(npx wrangler@4 deploy --message "CI deploy $(git rev-parse --short HEAD)" 2>&1 | tee /dev/stderr)
          ver=$(echo "$out" | sed -n 's/.*Current Version ID: \([^ ]*\).*/\1/p' | tail -1)
          test -n "$ver"
          echo "Promoting version $ver to 100%"
          npx wrangler@4 versions deploy "${ver}@100" -y --message "CI promote 100% $(git rev-parse --short HEAD)"
          echo "WORKER_VERSION=$ver" >> "$GITHUB_ENV"
      - name: Smoke ping (Worker must be live even without secret put)
        run: |
          set -euo pipefail
          # deploy-secret-race-h1: прод жив после promote; hasTelegramToken ожидаем от унаследованных секретов
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 30 "https://boinya-c.konchaarsenia.workers.dev/?action=ping&cutover=1" | tee /tmp/ping.json; then
              break
            fi
            sleep 3
          done
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/ping.json"))
          assert d.get("live") is True and d.get("d1") is True and d.get("notifyGroup")=="off", d
          assert d.get("hasTelegramToken") is True, d
          print("ping OK", d.get("deployMarker"), "tg", d.get("hasTelegramToken"), "ver", __import__("os").environ.get("WORKER_VERSION",""))
          PY
