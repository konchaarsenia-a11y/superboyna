# Live smoke: 2 партии жевалок → себес/шт + средняя. Карточки не пишет.
name: chew-batch-avg

on:
  pull_request:
    paths:
      - .github/workflows/chew-batch-avg.yml
      - scripts/chew-batch-avg-live.mjs
      - boinya-c/proxy/price-canon-v2.js
      - boinya-c/proxy/worker.js
      - boinya-c/next/retail-admin.js
      - boinya-c/next/clients.js
  push:
    branches: [main]
    paths:
      - .github/workflows/chew-batch-avg.yml
      - scripts/chew-batch-avg-live.mjs
      - boinya-c/proxy/price-canon-v2.js
      - boinya-c/proxy/worker.js
      - boinya-c/next/retail-admin.js
      - boinya-c/next/clients.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: formula unit
        run: node --test boinya-c/proxy/price-canon-v2.test.mjs

  live:
    # chew-batch-avg: live на PR (мягко), push/main и dispatch (жёстко).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: wait worker-deploy on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            last=$(gh run list --workflow=boinya-c-worker-deploy.yml --branch main --limit 1 --json conclusion,status,headSha -q '.[0]')
            echo "$i $last"
            sha=$(echo "$last" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("headSha") or "")')
            conc=$(echo "$last" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')
            st=$(echo "$last" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")')
            if [ "$sha" = "${{ github.sha }}" ] && [ "$conc" = "success" ]; then exit 0; fi
            if [ "$sha" = "${{ github.sha }}" ] && [ "$conc" = "failure" ]; then exit 1; fi
            sleep 15
          done
          echo "worker-deploy timeout"; exit 1
      - name: live 2 piece batches + cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHEW_BATCH_OUT: ${{ github.workspace }}/artifacts/chew-batch-avg
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/chew-batch-avg-live.mjs || {
              echo "::warning::live save failed (worker ещё без патча?) — unit ок"
              exit 0
            }
          else
            node scripts/chew-batch-avg-live.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chew-batch-avg
          path: artifacts/chew-batch-avg/
          if-no-files-found: warn
