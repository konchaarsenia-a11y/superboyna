name: andrei-oct5-restore

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/andrei-card-hunt-f592
    paths:
      - "scripts/recover-andrei-oct5-restore.mjs"
      - ".github/workflows/andrei-oct5-restore.yml"

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Self-test
        run: node scripts/recover-andrei-oct5-restore.mjs --self-test
      - name: Restore 5 Oct only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
          RESTORE_CONFIRM: restore-andreiprigunov-oct5
        run: node scripts/recover-andrei-oct5-restore.mjs --allow-write
