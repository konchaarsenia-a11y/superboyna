name: addr-parts

on:
  pull_request:
    paths:
      - .github/workflows/addr-parts.yml
      - scripts/addr-parts-plan.mjs
      - boinya-c/next/order-payload.js
      - boinya-c/next/addr-parts.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/addr-parts.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  read:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: List glued addresses and PP misses
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash "$GITHUB_WORKSPACE/scripts/addr-parts-read.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addr-parts-read
          path: artifacts/addr-parts/
          if-no-files-found: warn

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait until worker deploy on this sha finishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          deadline = time.time() + 20 * 60
          active = {"queued", "in_progress", "waiting", "pending", "requested"}
          while time.time() < deadline:
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/actions/runs?head_sha=%s&per_page=100" % (repo, sha),
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "User-Agent": "addr-parts"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  runs = json.load(resp).get("workflow_runs") or []
              mine = [r for r in runs if r.get("name") == "boinya-c-worker-deploy"]
              if not mine:
                  print("worker-deploy: ещё нет", flush=True)
                  time.sleep(15)
                  continue
              if any(r.get("status") in active for r in mine):
                  print("worker-deploy: ещё идёт", flush=True)
                  time.sleep(15)
                  continue
              last = sorted(mine, key=lambda r: r.get("created_at") or "")[-1]
              print("worker-deploy: " + str(last.get("conclusion")), flush=True)
              if last.get("conclusion") != "success":
                  raise SystemExit("worker-deploy не зелёный")
              break
          else:
              raise SystemExit("worker-deploy не дождались")
          PY
      - name: Split future addresses
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash "$GITHUB_WORKSPACE/scripts/addr-parts-apply.sh"
      - name: Delete one-time ADDR_PARTS_ADMIN_TOKEN
        if: always()
        working-directory: boinya-c/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx --yes wrangler@4 secret delete ADDR_PARTS_ADMIN_TOKEN || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addr-parts-apply
          path: artifacts/addr-parts/
          if-no-files-found: warn
