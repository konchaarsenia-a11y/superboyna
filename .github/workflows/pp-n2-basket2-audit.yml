name: pp-n2-basket2-audit

on:
  pull_request:
    paths:
      - .github/workflows/pp-n2-basket2-audit.yml
      - scripts/pp-n2-basket2-audit.mjs
      - boinya-c/proxy/pp-per-delivery.js
      - boinya-c/proxy/pp-per-delivery.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit split/classify
        run: node --test boinya-c/proxy/pp-per-delivery.test.mjs
      - name: RO audit production PP N=2 empty basket2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PP_N2_AUDIT_OUT: ${{ github.workspace }}/artifacts/pp-n2-basket2-audit
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          mkdir -p "$PP_N2_AUDIT_OUT"
          node scripts/pp-n2-basket2-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pp-n2-basket2-audit
          path: artifacts/pp-n2-basket2-audit/
          if-no-files-found: warn
