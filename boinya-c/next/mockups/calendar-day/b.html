<!DOCTYPE html>
<html lang="ru" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>День B</title>
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../tg.css">
</head>
<body>
<div class="tg">


<header class="tg-top"><h1>Заказы</h1></header>
<p class="tg-h">2 октября</p>
<section class="tg-sec">
  <div class="tg-row"><div class="tg-grow"><div class="tg-title">Барсик <span class="dogs">2 собаки</span></div><div class="tg-sub">Анна, ПП, 48,00 BYN</div></div></div>
  <div class="tg-row"><div class="tg-grow"><div class="tg-title">Рекс</div><div class="tg-sub">Мира, БП</div></div></div>
</section>
<div class="scrim"></div>
<div class="sheet">
  <div class="grab"></div>
  <p class="tg-h" style="margin-top:4px">Барсик, состав</p>
  <section class="tg-sec">
<div class="grp"><h4>Дрессура</h4>
  <div class="tg-line">Лёгкое, ломтики — 200 г</div>
  <div class="tg-line">Сердце, полоски — 100 г</div>
</div>
<div class="grp"><h4>Жевалки</h4>
  <div class="tg-line">Трахея говяжья — 2 шт</div>
</div>
<div class="grp"><h4>Присыпки</h4>
  
<div class="tg-line">Крошка лёгкого — 100 г</div>
<div class="tg-line">Крошка микс — 100 г</div>
<div class="crumb">
  <div class="tg-line">Лёгкое — 60 г</div>
  <div class="tg-line">Яблоки — 40 г</div>
</div>
</div>
    <div class="accent-band" style="margin-top:8px">
      <div><span>Слот</span><b>ПП 1</b></div>
      <div><span>Слот</span><b>ПП 2</b></div>
    </div>
  </section>
  <div class="tg-actions">
    <button class="tg-btn" type="button">Править</button>
    <button class="tg-btn sec" type="button">Перенести</button>
  </div>
</div>

</div>
</body>
</html>
