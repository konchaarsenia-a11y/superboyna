  <script>
    (function () {
      function insideTelegram(tg) {
        if (!tg) return false;
        try {
          if (String(tg.initData || "")) return true;
        } catch (e) {}
        var user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        return !!(user && user.id);
      }
      function scheme() {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (insideTelegram(tg) && (tg.colorScheme === "light" || tg.colorScheme === "dark")) return tg.colorScheme;
        } catch (e) {}
        try {
          var q = new URLSearchParams(location.search).get("scheme");
          if (q === "light" || q === "dark") return q;
        } catch (e2) {}
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) return "light";
        return "dark";
      }
      function apply() {
        var s = scheme();
        document.documentElement.setAttribute("data-scheme", s);
        document.documentElement.style.colorScheme = s;
      }
      apply();
      window.__boinyaApplyScheme = apply;
      try {
        var mq = window.matchMedia("(prefers-color-scheme: light)");
        if (mq.addEventListener) mq.addEventListener("change", apply);
      } catch (e3) {}
    })();
  </script>
