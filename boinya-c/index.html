<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="noindex">
  <title>Бойня C · sandbox</title>
  <style>
    html, body {
      margin: 0; background: #12141a; color: #f2f0ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .box { text-align: center; padding: 24px; }
    .badge {
      display: inline-block; background: #3dd6c6; color: #06221f;
      font-weight: 800; font-size: 11px; letter-spacing: .08em;
      padding: 4px 8px; margin-bottom: 12px;
    }
    p { color: #9aa3b5; font-size: 14px; }
  </style>
  <script src="seed-inline.js"></script>
  <script src="bridge.js"></script>
  <script src="client/config.js"></script>
  <script>
    (function () {
      var ver = "711149c";
      try {
        var base = window.__BOINYA_C_PROXY__ || "";
        if (base) {
          window.__boinyaWarm = function () {};
          var s = document.createElement("script");
          s.async = true;
          s.src = base.replace(/\/?$/, "") + "?action=keepWarm&callback=__boinyaWarm";
          (document.head || document.documentElement).appendChild(s);
        }
      } catch (eW) {}
      var q = "app.html?v=" + ver;
      try {
        var u = new URL(location.href);
        if (u.searchParams.get("proxy")) q += "&proxy=" + encodeURIComponent(u.searchParams.get("proxy"));
        if (u.searchParams.get("allowWrite")) q += "&allowWrite=" + encodeURIComponent(u.searchParams.get("allowWrite"));
      } catch (eQ) {}
      location.replace(q);
    })();
  </script>
</head>
<body>
  <div class="box">
    <div class="badge">C · SANDBOX</div>
    <p>Загрузка копии миниаппа…</p>
  </div>
</body>
</html>
