<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Бойня C</title>
  <!-- Критический путь: НЕ грузим seed/bridge здесь (иначе двойная загрузка). -->
  <link rel="preload" href="app.html?v=71115842" as="document">
  <link rel="preload" href="app.main.js?v=71115842" as="script">
  <link rel="preload" href="client/config.js" as="script">
  <link rel="preload" href="seed-inline.js" as="script">
  <link rel="preload" href="bridge.js" as="script">
  <style>
    html, body {
      margin: 0; background: #0a0a0a; color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .badge {
      display: inline-block; background: #3dd6c6; color: #06221f;
      font-weight: 800; font-size: 11px; letter-spacing: .08em;
      padding: 4px 8px; margin-bottom: 10px;
    }
    p { color: #8e8e93; font-size: 13px; margin: 0; }
  </style>
  <script>
    (function () {
      // Должен совпадать с APP_VER в app.html — иначе TG делает двойной reload ~1MB
      var ver = "71115842";
      var q = "app.html?v=" + ver;
      try {
        var u = new URL(location.href);
        ["proxy", "allowWrite", "live", "cutover", "sandbox", "mode", "via", "tid", "telegramId"].forEach(function (k) {
          if (u.searchParams.get(k)) q += "&" + k + "=" + encodeURIComponent(u.searchParams.get(k));
        });
        var sand = u.searchParams.get("sandbox") === "1" || u.searchParams.get("cutover") === "0";
        if (!sand && !u.searchParams.get("cutover") && u.searchParams.get("mode") !== "live" && u.searchParams.get("live") !== "1") {
          q += "&cutover=1";
        }
      } catch (e) {}
      location.replace(q);
    })();
  </script>
</head>
<body>
  <div style="text-align:center;padding:24px">
    <div class="badge">C · …</div>
    <p>Открытие…</p>
  </div>
</body>
</html>
