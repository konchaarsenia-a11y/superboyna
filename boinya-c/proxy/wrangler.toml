# Песочница Бойня C — Cloudflare Worker + D1
# Деплой: см. ../docs/SETUP_D1.md

name = "boinya-c"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
PEOPLE_CANON = "d1-primary"
OPS_CANON = "d1-primary"
DEFERRED_CANON = "d1-primary"
SUBS_CANON = "d1-primary"
WAREHOUSE_CANON = "d1-primary"
META_CANON = "d1-primary"
CUTTING_STRUCT_CANON = "d1-primary"
PRICE_CANON = "d1-primary"
PARTNER_CANON = "d1-primary"
GB_CANON = "d1-primary"
WEEK_D1_SYNC = "gas-authoritative"
WEEK_CLOSE_CANON = "d1-sync"

# Secret (не в vars): wrangler secret put TELEGRAM_BOT_TOKEN
# Без секрета sendCourier/forceSurvey → GAS fallback

[[d1_databases]]
binding = "DB"
database_name = "boinya-c"
database_id = "8ab3668c-a654-432c-9ebd-a1ac5c4db800"
