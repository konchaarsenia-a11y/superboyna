<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>sneakerworld — каталог</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .api-banner{margin:12px 0;padding:10px 12px;border:1px dashed rgba(255,255,255,.25);border-radius:10px;color:var(--muted);font-size:13px}
      .api-banner.ok{border-color:rgba(79,212,255,.45);color:var(--cyan)}
      .api-banner.err{border-color:rgba(196,30,42,.5);color:#ffb4ba}
      .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none}
      .modal-bg.open{display:block}
      .modal{position:fixed;left:0;right:0;bottom:0;z-index:81;width:min(480px,100%);margin:0 auto;
        background:#151618;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 18px 24px;
        transform:translateY(110%);transition:transform .22s ease}
      .modal.open{transform:translateY(0)}
      .modal h3{margin:0 0 12px;font-family:var(--display);font-size:28px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
      .modal label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}
      .modal input,.modal select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#121316;color:var(--ink);padding:0 12px}
      .modal .actions{display:grid;gap:8px;margin-top:14px}
    </style>
  </head>
  <body class="page-catalog">
    <header class="top">
      <div class="top-inner">
        <a class="brand" href="index.html">
          <div>
            <h1>sneakerworld</h1>
            <small>Каталог · live API</small>
          </div>
        </a>
      </div>
    </header>
    <main class="wrap">
      <section class="catalog-section">
        <div class="head">
          <h3>Каталог</h3>
          <p>Наличие в реальном времени. Оплата при получении.</p>
        </div>
        <div class="api-banner" id="apiStatus">Подключение к API…</div>
        <div class="filters sticky-filters">
          <div class="street-toggles">
            <select class="street-drop" id="brandFilter" style="appearance:auto"></select>
            <input class="street-drop" id="qFilter" placeholder="Поиск" style="transform:none" />
          </div>
        </div>
        <div class="empty" id="catalogEmpty">Ничего не найдено</div>
        <div class="catalog-grid" id="catalogList"></div>
      </section>
    </main>
    <div class="dock">
      <div class="dock-inner">
        <a class="btn-catalog" href="index.html">Главная</a>
        <button class="btn btn-rug" type="button" id="openHint">Как заказать</button>
      </div>
    </div>

    <div class="modal-bg" id="modalBg"></div>
    <div class="modal" id="orderModal" aria-hidden="true">
      <h3>Заказ</h3>
      <div class="subt" id="orderProduct"></div>
      <label>Размер</label>
      <select id="orderSize"></select>
      <label>ФИО</label>
      <input id="orderName" autocomplete="name" />
      <label>Телефон</label>
      <input id="orderPhone" autocomplete="tel" placeholder="+375…" />
      <label>Получение</label>
      <select id="orderFulfillment">
        <option value="pickup">Самовывоз · пр-т Дзержинского 19</option>
        <option value="delivery">Доставка</option>
      </select>
      <label>Адрес</label>
      <input id="orderAddress" placeholder="для доставки" />
      <div class="actions">
        <button class="btn btn-rug" type="button" id="orderSubmit" style="width:100%">Оформить</button>
        <button class="btn" type="button" id="orderCancel" style="width:100%">Отмена</button>
      </div>
      <p class="subt" id="orderResult" style="margin-top:10px"></p>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const API = localStorage.getItem('ws_api') || 'http://127.0.0.1:3080/api';
      const statusEl = document.getElementById('apiStatus');
      const listEl = document.getElementById('catalogList');
      const emptyEl = document.getElementById('catalogEmpty');
      const brandEl = document.getElementById('brandFilter');
      const qEl = document.getElementById('qFilter');
      const modal = document.getElementById('orderModal');
      const modalBg = document.getElementById('modalBg');
      const toast = document.getElementById('toast');
      let current = null;
      let selectedSizeBtn = null;

      function showToast(t) {
        toast.textContent = t;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }
      function openModal(p, size) {
        current = p;
        document.getElementById('orderProduct').textContent = p.name + ' · ' + Number(p.price_byn).toFixed(0) + ' BYN · арт. ' + p.article;
        const sel = document.getElementById('orderSize');
        sel.innerHTML = (p.sizes || []).map(s => `<option value="${s.size}" ${s.size===size?'selected':''}>${s.size} · ${s.qty} шт</option>`).join('');
        document.getElementById('orderResult').textContent = '';
        modal.classList.add('open'); modalBg.classList.add('open');
      }
      function closeModal() {
        modal.classList.remove('open'); modalBg.classList.remove('open');
      }

      async function loadBrands() {
        const data = await fetch(API + '/brands').then(r => r.json());
        brandEl.innerHTML = '<option value=\"\">Все бренды</option>' +
          (data.brands || []).map(b => `<option value="${b.brand}">${b.brand}</option>`).join('');
      }

      async function loadCatalog() {
        const params = new URLSearchParams();
        if (brandEl.value) params.set('brand', brandEl.value);
        if (qEl.value.trim()) params.set('q', qEl.value.trim());
        const data = await fetch(API + '/catalog?' + params).then(r => r.json());
        const products = data.products || [];
        emptyEl.classList.toggle('show', !products.length);
        listEl.innerHTML = products.map(p => {
          const sizes = (p.sizes || []).map(s => `<button class="size" type="button" data-size="${s.size}">${s.size}</button>`).join('');
          return `<article class="prod" data-json='${JSON.stringify(p).replace(/'/g,"&apos;")}'>
            <div class="prod-body">
              <div>
                <div class="title">${p.name}</div>
                <div class="subt">${p.brand || ''} · арт. ${p.article}</div>
              </div>
              <div class="sizes">${sizes}</div>
              <div class="row">
                <div class="price">${Number(p.price_byn).toFixed(0)} BYN</div>
                <button class="buy" type="button">Заказать</button>
              </div>
            </div>
          </article>`;
        }).join('');
      }

      listEl.addEventListener('click', (e) => {
        const card = e.target.closest('.prod');
        if (!card) return;
        const p = JSON.parse(card.getAttribute('data-json'));
        if (e.target.classList.contains('size')) {
          card.querySelectorAll('.size').forEach(b => b.classList.toggle('on', b === e.target));
          card.dataset.pickedSize = e.target.dataset.size;
          return;
        }
        if (e.target.classList.contains('buy')) {
          const size = card.dataset.pickedSize || (p.sizes[0] && p.sizes[0].size);
          openModal(p, size);
        }
      });

      document.getElementById('orderCancel').onclick = closeModal;
      modalBg.onclick = closeModal;
      document.getElementById('orderSubmit').onclick = async () => {
        const body = {
          customerName: document.getElementById('orderName').value.trim(),
          phone: document.getElementById('orderPhone').value.trim(),
          address: document.getElementById('orderAddress').value.trim(),
          fulfillment: document.getElementById('orderFulfillment').value,
          items: [{ product_id: current.id, size: document.getElementById('orderSize').value, qty: 1 }]
        };
        if (!body.customerName || !body.phone) {
          document.getElementById('orderResult').textContent = 'Укажите ФИО и телефон';
          return;
        }
        const r = await fetch(API + '/orders', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const data = await r.json();
        if (!data.ok) {
          document.getElementById('orderResult').textContent = data.error || 'Ошибка';
          return;
        }
        document.getElementById('orderResult').textContent = 'Номер заказа: ' + data.order.order_number + '. Менеджер свяжется с вами.';
        showToast('Заказ ' + data.order.order_number);
        await loadCatalog();
      };

      document.getElementById('openHint').onclick = () => showToast('Выберите размер и нажмите «Заказать»');

      (async () => {
        try {
          const h = await fetch(API + '/health').then(r => r.json());
          if (!h.ok) throw new Error('health');
          statusEl.textContent = 'API online · наличиеция сразу списывает размер · TG-уведомление админу';
          statusEl.classList.add('ok');
          await loadBrands();
          await loadCatalog();
        } catch (e) {
          statusEl.textContent = 'API недоступен (' + API + ')';
          statusEl.classList.add('err');
        }
      })();
      brandEl.addEventListener('change', loadCatalog);
      qEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadCatalog(); });
    </script>
  </body>
</html>
