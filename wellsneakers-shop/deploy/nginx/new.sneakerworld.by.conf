# Хост: /etc/nginx/sites-available/new.sneakerworld.by
# TLS добавит: certbot --nginx -d new.sneakerworld.by
#
# Не вешать server_name sneakerworld.by / www — старый OpenCart остаётся на 87.232.64.20.

server {
    listen 80;
    listen [::]:80;
    server_name new.sneakerworld.by;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
