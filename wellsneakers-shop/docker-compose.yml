# Прод: 2 GB RAM. С хоста только loopback.
# Снаружи — системный nginx :80/:443 → 127.0.0.1:8080 (см. DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wellsneakers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellsneakers}
      POSTGRES_DB: ${POSTGRES_DB:-wellsneakers}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ws_pg:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellsneakers -d wellsneakers"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    shm_size: 64m
    logging: &default_log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      PORT: "3080"
      DATABASE_URL: postgres://${POSTGRES_USER:-wellsneakers}:${POSTGRES_PASSWORD:-wellsneakers}@db:5432/${POSTGRES_DB:-wellsneakers}
      UPLOADS_DIR: /app/uploads
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      ALLOW_DEV_STAFF: ${ALLOW_DEV_STAFF:-0}
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ws_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s
    mem_limit: 384m
    logging: *default_log

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web:/usr/share/nginx/html/web:ro
      - ./miniapp:/usr/share/nginx/html/miniapp:ro
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    logging: *default_log

volumes:
  ws_pg:
  ws_uploads:
