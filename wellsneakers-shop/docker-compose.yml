services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wellsneakers
      POSTGRES_PASSWORD: wellsneakers
      POSTGRES_DB: wellsneakers
    ports:
      - "5432:5432"
    volumes:
      - ws_pg:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellsneakers -d wellsneakers"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      PORT: "3080"
      DATABASE_URL: postgres://wellsneakers:wellsneakers@db:5432/wellsneakers
      WEB_ORIGIN: "*"
      BOT_TOKEN: ""
      ADMIN_TELEGRAM_IDS: ""
    ports:
      - "3080:3080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  ws_pg:
