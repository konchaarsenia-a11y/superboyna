<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Good Boy · партнёры</title>
  <style>
    html, body {
      margin: 0; background: #070707; color: #f4ebe0;
      font-family: "Outfit", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
  </style>
  <script>
    (function () {
      // Только локальный app.html на Pages (text/html + assets/*).
      // jsDelivr отдаёт .html как text/plain → «просто код» без картинок.
      // Telegram кладёт initData в location.hash (#tgWebAppData=…).
      // replace без hash убивает сессию — Mini App думает, что открыли в браузере.
      var ver = "370";
      try {
        var hash = location.hash || "";
        if (/tgWebAppData/i.test(hash)) {
          sessionStorage.setItem("gb_varka_tg_hash", hash);
          var m = hash.match(/tgWebAppData=([^&]*)/i);
          if (m && m[1]) {
            var data;
            try { data = decodeURIComponent(m[1].replace(/\+/g, " ")); }
            catch (eDec) { data = m[1]; }
            sessionStorage.setItem("__telegram__initParams", JSON.stringify({ tgWebAppData: data }));
          }
        }
      } catch (eSt) {}
      try {
        var dest = new URL("app.html", location.href);
        dest.searchParams.set("v", ver);
        var cur = new URL(location.href);
        cur.searchParams.forEach(function (val, key) {
          if (key !== "v") dest.searchParams.set(key, val);
        });
        dest.hash = location.hash || "";
        location.replace(dest.pathname + dest.search + dest.hash);
      } catch (e) {
        location.replace("app.html?v=" + ver + (location.hash || ""));
      }
    })();
  </script>
</head>
<body>
  <p>Загрузка…</p>
</body>
</html>
