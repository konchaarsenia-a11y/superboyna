  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    html, body {
      margin: 0; background: #121212; color: #f5f5f7;

  </style>
  <script>
    // Постоянный URL для BotFather. Версия = цифры из APP_VER в app.html (v7.11.71 → 71171).
    (function () {
      var ver = "711147";
      var bust = ver + "-" + Date.now().toString(36);
      location.replace("app.html?v=" + ver + "&_=" + encodeURIComponent(bust));
    })();
  </script>
</head>
