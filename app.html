<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Конвейер Бойня → C</title>
  <script>
    /* КРИТИЧНО: бот открывал этот app.html (без Worker) — delete/move на «Будущая» ломались.
       Весь конвейер C живёт в boinya-c/ (Worker+D1). Редирект сохраняет query (?xfer=…). */
    (function () {
      try {
        var u = new URL(location.href);
        if (u.pathname.indexOf("/boinya-c/") >= 0) return;
        var destPath = u.pathname.replace(/\/app\.html$/i, "/boinya-c/app.html");
        if (destPath === u.pathname) {
          destPath = u.pathname.replace(/\/?$/, "/") + "boinya-c/app.html";
        }
        var dest = u.origin + destPath;
        var q = new URLSearchParams(u.search);
        if (!q.get("cutover")) q.set("cutover", "1");
        q.set("v", "71115877");
        q.set("_from", "legacy-app");
        location.replace(dest + "?" + q.toString());
      } catch (e) {
        location.replace("./boinya-c/app.html?cutover=1&v=71115877");
      }
    })();
  </script>
</head>
<body style="background:#0a0a0a;color:#f5f5f7;font-family:sans-serif;padding:24px;text-align:center">
  <p>Открываю Бойню C…</p>
  <p><a style="color:#3dd6c6" href="./boinya-c/app.html?cutover=1&v=71115877">Если не открылось — нажми сюда</a></p>
  <p><a style="color:#9a9a9a" href="./boinya-c/reset.html">Сброс кэша</a></p>
</body>
</html>
