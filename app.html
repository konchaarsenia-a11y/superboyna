<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Конвейер Бойня → C</title>
  <script>
    /* КРИТИЧНО: бот открывал этот app.html (без Worker) — delete/move на «Будущая» ломались.
       Весь конвейер C живёт в boinya-c/ (Worker+D1). Редирект сохраняет query (?xfer=…). */
    (function () {
      try {
        var u = new URL(location.href);
        if (u.pathname.indexOf("/boinya-c/") >= 0) return;
        var q0 = new URLSearchParams(u.search);
        var file = q0.get("legacy") === "1" ? "/boinya-c/app.html" : "/boinya-c/next.html";
        var destPath = u.pathname.replace(/\/app\.html$/i, file);
        if (destPath === u.pathname) {
          destPath = u.pathname.replace(/\/?$/, "/") + file.replace(/^\//, "");
        }
        var dest = u.origin + destPath;
        var q = new URLSearchParams(u.search);
        if (q.get("sandbox") !== "1" && q.get("cutover") !== "0" && !q.get("cutover")) q.set("cutover", "1");
        if (!q.get("v")) q.set("v", "71116600");
        q.set("_from", "legacy-app");
        location.replace(dest + "?" + q.toString() + (u.hash || ""));
      } catch (e) {
        var legacy = /[?&]legacy=1(?:&|$)/.test(location.search || "");
        location.replace((legacy ? "./boinya-c/app.html?legacy=1&cutover=1&v=71116600" : "./boinya-c/next.html?cutover=1&v=71116600") + (location.hash || ""));
      }
    })();
  </script>
</head>
<body style="background:#0a0a0a;color:#f5f5f7;font-family:sans-serif;padding:24px;text-align:center">
  <p>Открываю Бойню C…</p>
  <p><a style="color:#3dd6c6" href="./boinya-c/next.html?cutover=1&v=71116600">Если не открылось — нажми сюда</a></p>
  <p><a style="color:#9a9a9a" href="./boinya-c/reset.html">Сброс кэша</a></p>
</body>
</html>
