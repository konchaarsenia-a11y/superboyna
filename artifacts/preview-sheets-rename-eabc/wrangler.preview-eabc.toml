# ISOLATED PREVIEW — NEVER bind production D1 8ab3668c-a654-432c-9ebd-a1ac5c4db800
# Worker name must NOT be boinya-c. No crons, no prod secrets copied by agent.
name = "boinya-c-preview-eabc"
main = "worker.js"
compatibility_date = "2024-11-01"
keep_vars = true

[vars]
PEOPLE_CANON = "d1-primary"
OPS_CANON = "d1-primary"
DEFERRED_CANON = "d1-primary"
SUBS_CANON = "d1-primary"
WAREHOUSE_CANON = "d1-primary"
META_CANON = "d1-primary"
CUTTING_STRUCT_CANON = "d1-primary"
PRICE_CANON = "d1-primary"
PARTNER_CANON = "d1-primary"
GB_CANON = "d1-primary"
WEEK_D1_SYNC = "gas-authoritative"
WEEK_CLOSE_CANON = "d1-sync"
OWNER_TELEGRAM_IDS = "650923866"
PARTNER_OWNER_TIDS = "827494606,650923866"
PARTNER_OWNER_USERNAMES = "one_more_person_228"
# Auth enforced when TELEGRAM_BOT_TOKEN secret present (preview-only token).
# Do NOT set AUTH_ENFORCE=0. Production Worker untouched.
SHEETS_MODE = "finish-only"
SHEETS_FINISH_ONLY = "1"
PREVIEW_ISOLATED = "1"
PREVIEW_MARKER = "preview-sheets-rename-eabc"
# Non-empty sentinel so empty-string never falls through to hardcoded prod GAS_ORIGIN.
# Runtime short-circuits on PREVIEW_ISOLATED before fetch.
GAS_ORIGIN = "https://boinya-c-preview-eabc.konchaarsenia.workers.dev/__gas_stub_unused"

[[d1_databases]]
binding = "DB"
database_name = "boinya-c-preview-eabc"
